name: Docker Image CI


on:
  push:
    tags:
      - '*'  # Executa para qualquer tag criada



jobs:
  build-and-push:
    runs-on: ubuntu-latest



    steps:
      # 1. Checkout do código
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Login no Docker Hub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Configura Buildx (para builds modernos)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Build e push usando a TAG criada como TAG da imagem
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/psc-proxy-wrapper:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/psc-proxy-wrapper:latest

